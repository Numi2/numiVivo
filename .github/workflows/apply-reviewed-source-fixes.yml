# Temporary, checksum-bound source repair. Removed after the reviewed changes
# are committed. This is not a build-time transform or a numerical substitute.
name: Apply reviewed full-product source fixes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-reviewed-source-fixes.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Numi2/numiVivo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Apply only the exact reviewed before/after file snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          changes = [
            ('Sources/NumiVivoKit/MD/VivoMDPacking.swift', 'd057d06dba821be5a95d4ad38195df04bc46ecf3', 'b2932144e1ff19c3bc84dc25af758fcda43ff247', [('sigma=.5*','sigma=0.5*')]),
            ('Sources/NumiVivoKit/Artifacts/ExperimentPack.swift', 'a2bc93711a9a1010ca0ffa60cec496f5e8ebc0fb', '26f50add0ab30cfc413fb0640adad1127ed4c0cc', [('VivoCampaignAxis','VivoExperimentCampaignAxis'),('VivoCampaignManifest','VivoExperimentCampaignManifest')]),
            ('Sources/NumiVivoKit/Artifacts/VivoEvidenceSnapshot.swift', '022b8c18c3b763c19c2b3a60cc76455cb559ca61', 'c009a0fe8cf1235d9a3b64e77e117683c1581f05', [('== try VivoCanonicalJSON.fingerprint(snapshotData)','== (try VivoCanonicalJSON.fingerprint(snapshotData))')]),
            ('Sources/NumiVivoKit/Artifacts/VivoProgramPackRecords.swift', '7c6a0350ddb77fb1471658d735d1cff08abffbbd', '2e9e9f79f918b6a785366f1ec3642efbc522200d', [('try section(', 'try self.section('),('species[speciesIndex].identifier','species[Int(speciesIndex)].identifier'),('parameters[$0].identifier','parameters[Int($0)].identifier')]),
            ('Sources/NumiVivoKit/Artifacts/VivoSourceArtifactCompiler+Physiology.swift', 'b4c8681d15bdfa76bc6e04b8073d5b0022b0a48f', '6ef78b025cd56a1deaab911ee940d4a5302d53c4', [('artifactFingerprint: prepared.fingerprint,','artifactFingerprint: prepared.fingerprint.hex,')]),
            ('Sources/NumiVivoKit/Artifacts/VivoStateCheckpointEnvelope.swift', 'e77cbbe79d0a8dc428e3205c8bb2c271f95fa2ff', 'e212d6a3382f8b9da8177722dbd4ea196380687b', [('        withUnsafeBytes(of: &littleEndian)','        Swift.withUnsafeBytes(of: &littleEndian)')]),
            ('Sources/NumiVivoCore/include/module.modulemap', 'dad738d60801cb0f619c0f4558ac85a27f49ede1', '18d0ff7a3ebec4366aa1d5dbf35dd74720dc7002', None)
          ]
          module = '// Swift imports the stable C interfaces; C++ implementation headers remain\n// available to the native target without being inferred as Swift submodules.\nmodule NumiVivoCore {\n    header "NumiVivoCore/NumiVivoCore.h"\n    header "NumiVivoCore/NumiVivoPackAccess.h"\n    header "NumiVivoCore/NumiVivoMechanismSynthesis.h"\n    header "NumiVivoCore/NumiVivoNetworkAnalysis.h"\n    export *\n}\n'
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          prepared = []
          for name, before, after, replacements in changes:
              path = pathlib.Path(name)
              data = path.read_bytes()
              if blob(data) != before:
                  raise RuntimeError('Reviewed source has changed; refusing to overwrite '+name)
              text = data.decode()
              if replacements is None: text = module
              else:
                  for old,new in replacements:
                      if old not in text: raise RuntimeError('Missing exact repair text in '+name)
                      text=text.replace(old,new)
              result=text.encode()
              if blob(result) != after: raise RuntimeError('Reviewed output hash mismatch in '+name)
              prepared.append((path,result))
          for path,data in prepared: path.write_bytes(data)
          subprocess.run(['git','add','--']+[str(p) for p,_ in prepared],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if set(staged) != {str(p) for p,_ in prepared}: raise RuntimeError('Unexpected staged files')
          PY
          git diff --cached --check
          git config user.name 'NumiVivo build integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(build): reconcile campaign types C ABI imports and artifact decoding'
          # A concurrent main update rejects this normal push; never force it.
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD
