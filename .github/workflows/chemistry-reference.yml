name: Chemistry reference materials
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chemistry-reference.yml'
      - 'ReferenceAdapters/PySCF/export_native_reference.py'
permissions:
  contents: read
concurrency:
  group: chemistry-reference-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preserve exact source independently of reference calculations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-materials
          git archive --format=tar.gz HEAD > source-materials/source-snapshot.tar.gz
          git rev-parse HEAD > source-materials/source-commit.txt
          (cd source-materials && sha256sum source-snapshot.tar.gz source-commit.txt) > source-materials/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chemistry-source-${{ github.sha }}
          path: source-materials/
          retention-days: 14
          if-no-files-found: error
  reference:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Collect reproducible oracle and source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference-materials/wheels
          python3 -m venv /tmp/numivivo-oracle
          /tmp/numivivo-oracle/bin/python -m pip install 'numpy==1.26.4' 'scipy==1.13.1' 'h5py==3.11.0' 'pyscf==2.8.0'
          /tmp/numivivo-oracle/bin/python -m pip freeze > reference-materials/python-lock.txt
          /tmp/numivivo-oracle/bin/python -m pip download --no-deps 'pyscf==2.8.0' -d reference-materials/wheels
          git archive --format=tar.gz HEAD > reference-materials/source-snapshot.tar.gz
          git rev-parse HEAD > reference-materials/source-commit.txt
          python3 --version > reference-materials/python-version.txt
          if [[ -f ReferenceAdapters/PySCF/export_native_reference.py ]]; then
            /tmp/numivivo-oracle/bin/python ReferenceAdapters/PySCF/export_native_reference.py reference-materials
          else
            /tmp/numivivo-oracle/bin/python - <<'PY'
          import json, pathlib, pyscf
          from pyscf import gto, scf, cc, fci
          mol = gto.M(atom='H 0 0 -0.7; H 0 0 0.7', unit='Bohr', basis='sto-3g', verbose=0)
          mf = scf.RHF(mol).run(conv_tol=1e-12)
          correlated = cc.CCSD(mf).run(conv_tol=1e-11)
          exact = fci.FCI(mf).kernel()[0]
          result = {'oracle': 'PySCF', 'version': pyscf.__version__, 'system': 'H2', 'distanceBohr': 1.4,
                    'basis': 'STO-3G', 'hf': mf.e_tot, 'ccsd': correlated.e_tot, 'fci': exact,
                    'hfConverged': bool(mf.converged), 'ccsdConverged': bool(correlated.converged)}
          pathlib.Path('reference-materials/bootstrap-reference.json').write_text(json.dumps(result, indent=2)+'\n')
          PY
          fi
          (cd reference-materials && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > reference-materials/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chemistry-reference-${{ github.sha }}
          path: reference-materials/
          retention-days: 14
          if-no-files-found: error
