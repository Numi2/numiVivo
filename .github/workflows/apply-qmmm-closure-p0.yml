name: One-time QM/MM closure P0 repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-qmmm-closure-p0.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Repair current compiler blocker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sources/NumiVivoKit/QMEnv/VivoQMMMDynamicalTransmission.swift')
          s=p.read_text()
          old='output.transmissionProbability = result.transmissionCoefficient;output.transmissionOrigin = .calculated'
          new='output.transmissionProbability = result.transmissionCoefficient; output.transmissionOrigin = .calculated'
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git add Sources/NumiVivoKit/QMEnv/VivoQMMMDynamicalTransmission.swift
          git -c user.name='NumiVivo closure' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(qmmm): restore typed transmission build'
          git push origin HEAD:main
