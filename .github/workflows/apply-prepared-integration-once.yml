name: One-time prepared molecular source integration
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-prepared-integration-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'Numi2/numiVivo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PATCH_BASE64: >-
        
        
        
        
    steps:
      - name: Apply exactly the reviewed source patch without building or testing
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS="$RUNNER_TEMP/numivivo-source-askpass"
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"
          git init --quiet source
          cd source
          git config core.autocrlf false
          git config core.hooksPath /dev/null
          git config commit.gpgsign false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth=128 origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 54fac0f50f03257cbc980d46fad40668f74863fc HEAD
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          compressed = base64.b64decode(os.environ['PATCH_BASE64'])
          patch = lzma.decompress(compressed)
          assert len(patch) == 116942
          assert hashlib.sha256(patch).hexdigest() == 'b16a7f9980a449dbad1fced5252b3913d6d629a8b74ff996335c99314b391321'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'numivivo-prepared.patch').write_bytes(patch)
          PY
          git apply --index --check "$RUNNER_TEMP/numivivo-prepared.patch"
          git apply --index "$RUNNER_TEMP/numivivo-prepared.patch"
          git diff --cached --check
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          expected = {
            'Documentation/PreparedMolecularWorkflows.md': '8d9fa0a77009ce33e609edc063030ac0e6e7b1ad682e0d8d62fcf4929042d086',
            'Documentation/README.md': 'c47489ada9061ea505d3a84fbfabb8cf89461bad33392975b0973344160f9b3f',
            'README.md': 'aeb6e31c1add9dfc0298a616065b78dc6248ce6d329ebcfc7cfa3b6445112da3',
            'Sources/NumiVivoCLI/VivoPreparedMolecularCLICommands.swift': 'a77575acc8f8ace4634d329a51742d0976fe0e9ecd0b2df62b086cee87a4fb30',
            'Sources/NumiVivoCLI/VivoReactionCLICommands.swift': '5402c8e2e6c425e6ad73491c817808a8df76589f1e13e718da435da65b7c9477',
            'Sources/NumiVivoCLI/main.swift': '942acf7ea16df8c6aeb4a38f6d80068dc96bddda7cbb180bf1d5f766acdcae5b',
            'Sources/NumiVivoKit/Chemistry/VivoPreparedReactionRate.swift': '527eafb4c0f4035eeea904d3d99f1e6f564c7b8155f4be0138426c669d06cc3e',
            'Sources/NumiVivoKit/ForceField/VivoForceFieldCompiler.swift': 'a8a0c7e73d8d4c89c1afef14148d0d1739d2a3f69fe24d290193e18c9e339526',
            'Sources/NumiVivoKit/ForceField/VivoForceFieldImpropers.swift': '636a50669b18e7d68c4181771a02ef2c211dd03b99b47e39dfc598eed75ef99a',
            'Sources/NumiVivoKit/ForceField/VivoForceFieldLibrary.swift': '3a94e4061fdb042ccb2c50b9a281bfe86cf0ba7d51ae913f5b5e5446d2456fce',
            'Sources/NumiVivoKit/MD/VivoMolecularSampling.swift': '048db0bf5c3a2b54b449a0a36cf29a0e2d8bd6a4903eefb085dd6534301589d9',
            'Sources/NumiVivoKit/MD/VivoMolecularSamplingRunner.swift': '32963471ad9689d3e9899d6b516b0711523ccd200ac2bda351c0d49681fb0d28',
            'Sources/NumiVivoKit/ManyBody/VivoRIActiveSpace.swift': '08ae0b70cc2f01c00b57278d3e3bb4b21cea78c75a551350bb8bad98a9c083f6',
            'Sources/NumiVivoKit/ReactionQualification/VivoConnectedReaction.swift': '7cf3e7b15b21d9e34749335a4ef4300608cab265c745f10089fecb35194a4bb3',
            'Sources/NumiVivoKit/Structure/VivoMolecularPreparation.swift': '5682303514420aed445171d8a7f194490c804dd3c554162ea7bae9f5fd691d95',
            'Sources/NumiVivoKit/Workflow/VivoAdvancedChemistryOperations.swift': '1416b188947a8884a777483b1a61eed6a3773d88a615b438a92f01d4df3ca6be',
            'Sources/NumiVivoKit/Workflow/VivoPreparedMolecularWorkflow.swift': '2ba8305eb175024504f1b52bac9183ef142c7d5f4f20c3b40baafd282c12a949',
            'Sources/NumiVivoKit/Workflow/VivoReactionQualificationWorkflow.swift': 'e987f38ab32b6513002a0afab3d4b5e6540b53ab47ae86e21d945e010c14f6b6',
            'Tests/NumiVivoIntegrationTests/PreparedMolecularWorkflowTests.swift': 'b96f05bd618d42d2c1a26642d2421c0b416a1a5c42731e395b59848f50bbc3a7'
          }
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert changed == set(expected), 'Unexpected changed paths'
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          print('Verified exact source bytes for', len(expected), 'files; no build or tests executed')
          PY
          git -c user.name='NumiVivo source integration' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(platform): integrate prepared molecular sampling and context-bound reaction workflows'
          git push origin HEAD:refs/heads/main
          printf 'integrated-source-commit=%s\n' "$(git rev-parse HEAD)"
