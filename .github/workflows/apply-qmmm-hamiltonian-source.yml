name: Integrate periodic QM-MM Hamiltonian source
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-qmmm-hamiltonian-source.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'Numi2/numiVivo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: apply
        name: Verify and commit the exact prepared source patch
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, lzma, os, pathlib
          root = pathlib.Path('Tools/Development/QMMMIntegration')
          data = lzma.decompress(b''.join((root / f'part-{i}.xz').read_bytes() for i in range(6)))
          assert hashlib.sha256(data).hexdigest() == '02cb47c9d2b808066b13f1d2c9698b404fa1ebc72687f905b1ab7ca21c53fc7e'
          assert len(data) == 184812
          pathlib.Path(os.environ['RUNNER_TEMP'], 'qmmm-integration.patch').write_bytes(data)
          PY
          git fetch --depth=1 origin main
          git checkout -B qmmm-integration FETCH_HEAD
          git apply --check "$RUNNER_TEMP/qmmm-integration.patch"
          git apply "$RUNNER_TEMP/qmmm-integration.patch"
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('Sources/NumiVivoKit/MD/VivoMDVelocityInitializer.swift')
          p.write_text(p.read_text().rstrip() + '\n')
          PY
          git diff --check
          git config user.name 'NumiVivo development'
          git config user.email '33553832+Numi2@users.noreply.github.com'
          git add Sources Tests
          git commit -m 'feat(qmmm): integrate variational periodic HF and retained-force dynamics' -m 'Add analytic Gaussian/Pulay nuclear derivatives, self-consistent quadrupolar Ewald with exact-near correction and strain, generalized site Jacobians, smooth LJ switching and a geometry-bound stateless force provider inside the existing Metal transaction. Includes numerical and native integration regressions. Direct Ewald is the reference path; accelerated multipolar PME and polarizable/adaptive extensions remain separate work.'
          AUTH="$(printf 'x-access-token:%s' "$GH_WRITE_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  apple:
    needs: integrate
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
      - name: Build the exact full Apple product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qmmm-results"
          git rev-parse HEAD > "$RUNNER_TEMP/qmmm-results/source-commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/qmmm-results/source.tar.gz"
          swift --version > "$RUNNER_TEMP/qmmm-results/compiler.txt"
          uname -srm > "$RUNNER_TEMP/qmmm-results/platform.txt"
          swift build -c release --build-tests --jobs 3 -Xswiftc -enable-testing 2>&1 | tee "$RUNNER_TEMP/qmmm-results/build.log"
      - name: Run Hamiltonian and retained platform regression suites
        env:
          NUMIVIVO_TEST_ARTIFACTS: ${{ runner.temp }}/qmmm-results/native
          MTL_DEBUG_LAYER: '1'
        shell: bash
        run: |
          set -euo pipefail
          swift test -c release --skip-build --filter 'PeriodicQMMMHamiltonianTests|MDQMMMInterfaceTests|SolventPromotionTests|PlatformQMMMWorkflowTests|AppleExecutionTests' 2>&1 | tee "$RUNNER_TEMP/qmmm-results/tests.log"
          python3 - <<'PY'
          import os, pathlib
          text = pathlib.Path(os.environ['RUNNER_TEMP'], 'qmmm-results/tests.log').read_text()
          for suite in ['PeriodicQMMMHamiltonianTests', 'MDQMMMInterfaceTests', 'SolventPromotionTests', 'PlatformQMMMWorkflowTests', 'AppleExecutionTests']:
              assert f'Suite {suite} passed' in text, f'Missing executed suite: {suite}'
          PY
      - name: Preserve source cleanliness
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qmmm-results"
          git status --porcelain > "$RUNNER_TEMP/qmmm-results/git-status.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qmmm-hamiltonian-${{ needs.integrate.outputs.source }}
          path: ${{ runner.temp }}/qmmm-results/
          retention-days: 14
          if-no-files-found: error
