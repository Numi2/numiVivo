name: Integrate variational polarization and adaptive Hamiltonian source
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-qmmm-hamiltonian-source.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'Numi2/numiVivo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: apply
        name: Verify and integrate exact source without rewriting concurrent work
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,lzma,os,pathlib
          root=pathlib.Path('Tools/Development/QMMMIntegration')
          data=lzma.decompress(b''.join((root/f'polar-{i}.xz').read_bytes() for i in range(2)))
          assert len(data)==130173 and hashlib.sha256(data).hexdigest()=='6310160f36ca90d1626f1bf65f19cf5097ba0e813f5968c1efb86574dc0bc956'
          pathlib.Path(os.environ['RUNNER_TEMP'],'polar-adaptive.patch').write_bytes(data)
          PY
          git fetch --depth=1 origin main
          git checkout -B qmmm-integration FETCH_HEAD
          git apply --check "$RUNNER_TEMP/polar-adaptive.patch"
          git apply "$RUNNER_TEMP/polar-adaptive.patch"
          git diff --check
          git config user.name 'NumiVivo development'
          git config user.email '33553832+Numi2@users.noreply.github.com'
          git add Sources Tests
          git rm -r Tools/Development/QMMMIntegration
          git rm .github/workflows/apply-qmmm-hamiltonian-source.yml
          git commit -m 'feat(qmmm): couple mutual polarization and conservative adaptive partitions to existing MD' -m 'Add canonical induced dipoles, anisotropic local-frame derivatives, variational damping, distinct physical/embedding charge channels and joint density-response convergence. Stream complete partition energies through existing Metal Hamiltonian probes; retain transition forces, immutable reference energies, compensation derivatives and explicit resource admission. These bounded implementations do not claim large-system scaling, Drude dynamics or calibrated adaptive thermodynamics.'
          AUTH="$(printf 'x-access-token:%s' "$GH_WRITE_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  apple:
    needs: integrate
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
      - name: Build exact full Apple product and all test targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qmmm-results"
          git rev-parse HEAD > "$RUNNER_TEMP/qmmm-results/source-commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/qmmm-results/source.tar.gz"
          swift --version > "$RUNNER_TEMP/qmmm-results/compiler.txt"
          uname -srm > "$RUNNER_TEMP/qmmm-results/platform.txt"
          swift build -c release --build-tests --jobs 3 -Xswiftc -enable-testing 2>&1 | tee "$RUNNER_TEMP/qmmm-results/build.log"
      - name: Run polarization, adaptive, mesh and retained platform regressions
        env:
          NUMIVIVO_TEST_ARTIFACTS: ${{ runner.temp }}/qmmm-results/native
          MTL_DEBUG_LAYER: '1'
        shell: bash
        run: |
          set -euo pipefail
          swift test -c release --skip-build --filter 'PolarizableQMMMTests|AdaptiveQMMMHamiltonianTests|MultipolePMETests|PeriodicQMMMHamiltonianTests|MDQMMMInterfaceTests|SolventPromotionTests|PlatformQMMMWorkflowTests|AppleExecutionTests' 2>&1 | tee "$RUNNER_TEMP/qmmm-results/tests.log"
          python3 - <<'PY'
          import os,pathlib
          text=pathlib.Path(os.environ['RUNNER_TEMP'],'qmmm-results/tests.log').read_text()
          for suite in ['PolarizableQMMMTests','AdaptiveQMMMHamiltonianTests','MultipolePMETests','PeriodicQMMMHamiltonianTests','MDQMMMInterfaceTests','SolventPromotionTests','PlatformQMMMWorkflowTests','AppleExecutionTests']:
              assert f'Suite {suite} passed' in text,f'Missing executed suite: {suite}'
          PY
      - name: Preserve source cleanliness
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qmmm-results"
          git status --porcelain > "$RUNNER_TEMP/qmmm-results/git-status.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qmmm-polar-adaptive-${{ needs.integrate.outputs.source }}
          path: ${{ runner.temp }}/qmmm-results/
          retention-days: 14
          if-no-files-found: error
