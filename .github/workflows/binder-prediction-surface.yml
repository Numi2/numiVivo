name: Binder prediction surface qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/NumiVivoKit/Binder/VivoBinderPredictionAnalysis.swift'
      - 'Sources/NumiVivoKit/Structure/VivoMolecularInterface*.swift'
      - 'Tests/NumiVivoIntegrationTests/VivoBinderPredictionTests.swift'
      - 'Tests/NumiVivoIntegrationTests/VivoBinderSurfaceTests.swift'
      - 'Tools/BinderBenchmark/check_prediction_panel.py'
      - 'Tools/BinderBenchmark/test_prediction_panel.py'
      - '.github/workflows/binder-prediction-surface.yml'
  pull_request:
    paths:
      - 'Sources/NumiVivoKit/Binder/**'
      - 'Sources/NumiVivoKit/Structure/**'
      - 'Tools/BinderBenchmark/**'
      - '.github/workflows/binder-prediction-surface.yml'

permissions:
  contents: read

concurrency:
  group: binder-prediction-surface-${{ github.ref }}
  cancel-in-progress: false

jobs:
  numerical-reference:
    runs-on: ubuntu-24.04
    container: swift:6.2.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Sources/NumiVivoKit/Binder/
            /Sources/NumiVivoKit/Structure/
            /Sources/NumiVivoKit/Artifacts/VivoArtifactPrimitives.swift
            /Sources/NumiVivoCLI/VivoBinderCLICommands.swift
            /Tests/NumiVivoIntegrationTests/VivoBinder*Tests.swift
            /Tools/BinderBenchmark/
      - name: Install numerical reference dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python3-venv libssl-dev ca-certificates
          python3 -m venv /tmp/reference-python
          /tmp/reference-python/bin/pip install biopython==1.86 numpy==2.3.5
      - name: Check native owners and offline reference contracts
        run: |
          python3 Tools/BinderBenchmark/native_package.py /tmp/prediction-native --test
          /tmp/reference-python/bin/python Tools/BinderBenchmark/test_prediction_panel.py -v
          swift build --package-path /tmp/prediction-native -c release --jobs 2
      - name: Retrieve fixed published source panel
        if: github.event_name != 'pull_request'
        run: python3 Tools/BinderBenchmark/fetch_structure_panel.py /tmp/prediction-sources
      - name: Compare original predictions with independent numerical references
        if: github.event_name != 'pull_request'
        run: |
          /tmp/reference-python/bin/python Tools/BinderBenchmark/check_prediction_panel.py \
            /tmp/prediction-sources /tmp/prediction-native/.build/release/BinderCLI /tmp/prediction-qualified
      - name: Retain source, implementation and numerical results
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: binder-prediction-surface-${{ github.sha }}
          path: |
            /tmp/prediction-sources
            /tmp/prediction-qualified
            /tmp/prediction-native/Sources
            /tmp/prediction-native/Tests
            /tmp/prediction-native/Package.swift
            /tmp/prediction-native/.build/release/BinderCLI
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
