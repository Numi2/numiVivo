name: Complete native product contracts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Tools/Build/apply_shader_contracts.py', '.github/workflows/finish-product-contracts.yml']
permissions:
  contents: read
concurrency:
  group: finish-product-contracts
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publish explicit shader entry-point and reservoir contracts
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/Build/apply_shader_contracts.py
          git add Sources/NumiVivoShaders/Resources Sources/NumiVivoKit/Kinetics/VivoTargetEngagementProgramSource.swift
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(gpu): publish stable kernel host names and preserve external exposure ownership'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  full_product:
    needs: repair
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.repair.outputs.sha }}
          persist-credentials: false
      - name: Build and execute the complete product
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/full-product"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-commit.txt"
          git archive --format=tar.gz HEAD > "$OUT/source.tar.gz"
          swift --version > "$OUT/compiler.txt"
          uname -srm > "$OUT/platform.txt"
          swift build -c release --jobs 3 2>&1 | tee "$OUT/build.log"
          .build/release/numivivo --help > "$OUT/help.txt" 2>&1
          .build/release/numivivo md-help > "$OUT/md-help.txt" 2>&1
          .build/release/numivivo reaction-template h3-saddle --output "$OUT/saddle-request.json"
          .build/release/numivivo reaction-run "$OUT/saddle-request.json" --store "$RUNNER_TEMP/reaction-store" --output "$OUT/saddle-result.json" 2>&1 | tee "$OUT/reaction.log"
          shasum -a 256 .build/release/numivivo > "$OUT/binary.sha256"
      - name: Compile actual pipelines and execute molecular and MD GPU transactions
        env:
          NUMIVIVO_TEST_ARTIFACTS: ${{ runner.temp }}/full-product/metal-tests
        shell: bash
        run: |
          set -euo pipefail
          swift test -c release --jobs 3 --filter AppleExecutionTests 2>&1 | tee "$RUNNER_TEMP/full-product/metal-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: complete-product-${{ needs.repair.outputs.sha }}
          path: ${{ runner.temp }}/full-product/
          retention-days: 14
          if-no-files-found: error
