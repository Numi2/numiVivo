name: Complete native product contracts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/NumiVivoIntegrationTests/**'
      - 'Package.swift'
      - '.github/workflows/finish-product-contracts.yml'
permissions:
  contents: read
concurrency:
  group: native-product-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full_product:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the exact committed product and tests without source rewriting
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/full-product"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-commit.txt"
          git archive --format=tar.gz HEAD > "$OUT/source.tar.gz"
          swift --version > "$OUT/compiler.txt"
          uname -srm > "$OUT/platform.txt"
          swift build -c release --build-tests --jobs 3 -Xswiftc -enable-testing 2>&1 | tee "$OUT/build.log"
          .build/release/numivivo --help > "$OUT/help.txt" 2>&1
          .build/release/numivivo md-help > "$OUT/md-help.txt" 2>&1
          .build/release/numivivo reaction-template h3-saddle --output "$OUT/saddle-request.json"
          .build/release/numivivo reaction-run "$OUT/saddle-request.json" --store "$RUNNER_TEMP/reaction-store" --output "$OUT/saddle-result.json" 2>&1 | tee "$OUT/reaction.log"
          shasum -a 256 .build/release/numivivo > "$OUT/binary.sha256"
      - name: Run each real GPU gate separately and retain every failure
        env:
          NUMIVIVO_TEST_ARTIFACTS: ${{ runner.temp }}/full-product/metal-tests
          MTL_DEBUG_LAYER: '1'
          SWIFT_BACKTRACE: 'enable=yes,interactive=no,color=no'
        shell: bash
        run: |
          set +e
          set -uo pipefail
          OUT="$RUNNER_TEMP/full-product"
          failed=0
          for test in completePipelineCompilation molecularTransactionsAndInterventions targetKineticsOnMetalAgainstFP64 harmonicMDOnMetalAndExactRestart; do
            swift test -c release --skip-build --filter "$test" 2>&1 | tee "$OUT/$test.log"
            status=${PIPESTATUS[0]}
            printf '%s %s\n' "$test" "$status" >> "$OUT/test-exit-status.txt"
            if [[ $status -ne 0 ]]; then failed=1; fi
          done
          # Reproduce any target error through the actual production executable,
          # independently of Testing's async error-reporting machinery.
          printf '%s\n' '{"maximumTimeStepSeconds":0.0078125,"maximumSteps":1000000,"fractionBalanceTolerance":0.0001}' > "$OUT/target-policy.json"
          .build/release/numivivo engagement-run Examples/target-engagement/synthetic-pulse.json --backend metal --policy "$OUT/target-policy.json" --output "$OUT/target-cli-result.json" > "$OUT/target-cli.log" 2>&1
          status=$?
          printf 'production-target-cli %s\n' "$status" >> "$OUT/test-exit-status.txt"
          if [[ $status -ne 0 ]]; then
            failed=1
            xcrun lldb --batch -o run -o 'thread backtrace all' -- .build/release/numivivo engagement-run Examples/target-engagement/synthetic-pulse.json --backend metal --policy "$OUT/target-policy.json" --output "$OUT/target-debug-result.json" > "$OUT/target-lldb.log" 2>&1
          fi
          exit "$failed"
      - name: Retain process crash diagnostics and unchanged-source status
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/full-product/crashes"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -iname '*swift*' -o -iname '*NumiVivo*' -o -iname '*numivivo*' \) -exec cp '{}' "$RUNNER_TEMP/full-product/crashes/" ';' 2>/dev/null || true
          git status --porcelain > "$RUNNER_TEMP/full-product/git-status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: complete-product-${{ github.sha }}
          path: ${{ runner.temp }}/full-product/
          retention-days: 14
          if-no-files-found: error
