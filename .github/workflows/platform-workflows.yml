name: General platform workflows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/NumiVivoIntegrationTests/**'
      - 'Tools/Platform/**'
      - 'Tools/Benchmarks/**'
      - 'Examples/workflows/**'
      - 'Examples/prepared-reaction/**'
      - 'Package.swift'
      - '.github/workflows/platform-workflows.yml'
permissions:
  contents: read
concurrency:
  group: platform-workflows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the exact complete Apple product and test targets
        id: build
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/platform-results"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-commit.txt"
          git archive --format=tar.gz HEAD > "$OUT/source.tar.gz"
          swift --version > "$OUT/compiler.txt"
          uname -srm > "$OUT/platform.txt"
          swift build -c release --build-tests --jobs 3 -Xswiftc -enable-testing 2>&1 | tee "$OUT/build.log"
          shasum -a 256 .build/release/numivivo > "$OUT/binary.sha256"
          python3 - <<'PYRESOURCES'
          import hashlib, json, os, pathlib
          root = pathlib.Path(".build/release/NumiVivo_NumiVivoShaders.bundle").resolve(strict=True)
          files = sorted(p for p in root.rglob("*") if p.is_file())
          assert files, "Missing runtime shader resources"
          record = {"schema": "numivivo.org/test-evidence/shader-resources/v1", "files": [
              {"path": str(p.relative_to(root)), "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in files]}
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "platform-results/shader-resources.json").write_text(json.dumps(record, indent=2) + "\n")
          PYRESOURCES
      - name: Run platform, reaction hypotheses, QM/MM free-energy/PathCV/string, MBAR/alchemical/archive, latent topology, constant-pH/NCMC/replica exchange, state enumeration/catalog/thermodynamics, chemical qualification/exchange, real Metal and selected-CI regression suites
        env:
          NUMIVIVO_TEST_ARTIFACTS: ${{ runner.temp }}/platform-results/native
          MTL_DEBUG_LAYER: '1'
          NUMIVIVO_TEST_SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          swift test -c release --skip-build --filter 'MDBondedForceConformanceTests|MDBenchmarkTests|SamplingReactionSeedTests|ConditionalEncounterTests|PreparedReactionFullRouteTests|KineticsPreparedOutputTests|MolecularSamplingExporterTests|PlatformSnapshotMappingHelperTests|MolecularSamplingNativeBridgeTests|MolecularSamplingArchiveReaderTests|NuclearMetalResourceTests|ClassicalPMEConformanceTests|ClassicalThermalConformanceTests|ClassicalNPTTransitionTests|MetalSamplingIdentityTests|QMMMFreeEnergyArchiveIdentityTests|WorkflowCancellationTests|MDProtocolResumeTests|MDTrajectoryArchiveValidationTests|HybridRuntimeTests|PlatformWorkflowTests|PlatformSnapshotTests|MDQMMMInterfaceTests|PlatformQMMMWorkflowTests|PlatformMechanismWorkflowTests|MechanismCandidateEnumerationTests|QMMMFreeEnergyTests|QMMMTransmissionTests|QMMMPathCoordinateTests|QMMMPathBiasTests|QMMMStringRefinementTests|MultistateMBARTests|ChemicalStateAlchemicalFreeEnergyTests|MultistateReducedPotentialArchiveTests|LatentProtonTopologyTests|ConstantPHDiscreteMDTests|ConstantPHNCMCTests|ConstantPHNCMCMetalTests|NCMCProtocolKernelTests|ConstantPHReplicaExchangeTests|ConstantPHMetalAdapterTests|ChemicalStateEnumerationTests|ChemicalStateCatalogTests|QMMMChemicalStateThermodynamicsTests|QMMMChemicalQualificationTests|QMMMChemicalExchangeNetworkTests|SolventPromotionTests|AppleExecutionTests|SelectedCITests|BarrierTunnellingTests|RingPolymerSamplingTests|GlobalJointUncertaintyTests|GlobalKineticUncertaintyTests|ReactiveSurrogateTests|PrecisionMetalSamplingTests|PrecisionPlatformTests' 2>&1 | tee "$RUNNER_TEMP/platform-results/tests.log"
          python3 - <<'PYTEST'
          import os, pathlib
          text = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "platform-results/tests.log").read_text()
          for suite in ["MDBondedForceConformanceTests", "MDBenchmarkTests", "SamplingReactionSeedTests", "ConditionalEncounterTests", "PreparedReactionFullRouteTests", "KineticsPreparedOutputTests", "MolecularSamplingExporterTests", "PlatformSnapshotMappingHelperTests", "MolecularSamplingNativeBridgeTests", "MolecularSamplingArchiveReaderTests", "NuclearMetalResourceTests", "ClassicalPMEConformanceTests", "ClassicalThermalConformanceTests", "ClassicalNPTTransitionTests", "MetalSamplingIdentityTests", "QMMMFreeEnergyArchiveIdentityTests", "WorkflowCancellationTests", "MDProtocolResumeTests", "MDTrajectoryArchiveValidationTests", "HybridRuntimeTests", "PlatformWorkflowTests", "PlatformSnapshotTests", "MDQMMMInterfaceTests", "PlatformQMMMWorkflowTests", "PlatformMechanismWorkflowTests", "MechanismCandidateEnumerationTests", "QMMMFreeEnergyTests", "QMMMTransmissionTests", "QMMMPathCoordinateTests", "QMMMPathBiasTests", "QMMMStringRefinementTests", "MultistateMBARTests", "ChemicalStateAlchemicalFreeEnergyTests", "MultistateReducedPotentialArchiveTests", "LatentProtonTopologyTests", "ConstantPHDiscreteMDTests", "ConstantPHNCMCTests", "ConstantPHNCMCMetalTests", "NCMCProtocolKernelTests", "ConstantPHReplicaExchangeTests", "ConstantPHMetalAdapterTests", "ChemicalStateEnumerationTests", "ChemicalStateCatalogTests", "QMMMChemicalStateThermodynamicsTests", "QMMMChemicalQualificationTests", "QMMMChemicalExchangeNetworkTests", "SolventPromotionTests", "AppleExecutionTests", "SelectedCITests", "BarrierTunnellingTests", "RingPolymerSamplingTests", "GlobalJointUncertaintyTests", "GlobalKineticUncertaintyTests", "ReactiveSurrogateTests", "PrecisionMetalSamplingTests", "PrecisionPlatformTests"]:
              assert f"Suite {suite} passed" in text, f"Missing executed suite: {suite}"
          PYTEST
      - name: Verify accepted sampling export and connected electronic workflow
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NUMIVIVO_TEST_ARTIFACTS: ${{ runner.temp }}/platform-results/native
        shell: bash
        run: |
          set -euo pipefail
          SAMPLING_RECEIPT="$(python3 - <<'PYSAMPLING'
          import json, os, pathlib
          root = pathlib.Path(os.environ["NUMIVIVO_TEST_ARTIFACTS"])
          receipts = list(root.glob("molecular-sampling-prefix-*/sampling-prefix-receipt.json"))
          assert len(receipts) == 1, "Expected one retained native sampling prefix receipt"
          receipt = json.loads(receipts[0].read_text())
          assert receipt.get("status") == "success" and receipt.get("nativeStatus") == "accepted-metal-sampling-and-exact-prefix-resume", "Native sampling prefix did not complete"
          print(receipts[0])
          PYSAMPLING
          )"
          python3 Tools/Platform/check_sampling_export_cli.py --binary .build/release/numivivo \
            --fixture "$SAMPLING_RECEIPT" --out "$RUNNER_TEMP/platform-results/sampling-export-cli" \
            2>&1 | tee "$RUNNER_TEMP/platform-results/sampling-export-cli.log"
      - name: Run published preparation to reaction and observable through public CLI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/Platform/run_prepared_reaction_example.py --binary .build/release/numivivo \
            --out "$RUNNER_TEMP/platform-results/prepared-reaction-cli" \
            2>&1 | tee "$RUNNER_TEMP/platform-results/prepared-reaction-cli.log"
      - name: Verify long archive recovery and streaming CLI inspection
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep the large reproducible fixture outside uploaded evidence.
          export NUMIVIVO_TEST_ARTIFACTS="$RUNNER_TEMP/platform-archive-fixture"
          export NUMIVIVO_LONG_ARCHIVE_TESTS=1
          swift test -c release --skip-build --no-parallel \
            --filter archiveBeyondOneHundredThousandChunksResumesAndPreservesItsPrefix \
            2>&1 | tee "$RUNNER_TEMP/platform-results/long-archive.log"
          ARCHIVE_RECEIPT="$(python3 - <<'PYARCHIVE'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ["NUMIVIVO_TEST_ARTIFACTS"])
          receipts = list(root.glob("*/archive-validation-receipt.json"))
          assert len(receipts) == 1, "Expected one completed retained archive campaign"
          shutil.copyfile(receipts[0], pathlib.Path(os.environ["RUNNER_TEMP"]) / "platform-results/archive-receipt.json")
          print(receipts[0])
          PYARCHIVE
          )"
          python3 Tools/Platform/check_md_archive_cli.py --binary .build/release/numivivo \
            --receipt "$ARCHIVE_RECEIPT" --out "$RUNNER_TEMP/platform-results/archive-cli" \
            2>&1 | tee "$RUNNER_TEMP/platform-results/archive-cli.log"
      - name: Exercise real workflow CLI, partial failure, cache and safe export
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test -x .build/release/numivivo
          python3 Tools/Platform/check_workflow_cli.py .build/release/numivivo "$RUNNER_TEMP/platform-results/cli" 2>&1 | tee "$RUNNER_TEMP/platform-results/cli.log"
          .build/release/numivivo workflow-plan Examples/workflows/target-panel.json > "$RUNNER_TEMP/platform-results/target-plan.json"
          .build/release/numivivo workflow-run Examples/workflows/target-panel.json --store "$RUNNER_TEMP/platform-target-store" --output "$RUNNER_TEMP/platform-results/target-panel.json"
      - name: Record immutable source state
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/platform-results"
          git status --porcelain > "$RUNNER_TEMP/platform-results/git-status.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: platform-workflows-${{ github.sha }}
          path: ${{ runner.temp }}/platform-results/
          retention-days: 14
          if-no-files-found: error
