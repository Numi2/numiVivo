name: HCC1395 native reconstruction runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hcc1395-qualification.yml
      - Sources/NumiVivoCLI/main.swift
      - Sources/NumiVivoCLI/VivoGenomicEvidenceCLICommands.swift
permissions:
  contents: read
concurrency:
  group: hcc1395-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .build
          key: hcc1395-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: hcc1395-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and exercise the actual NumiVivo command routes
        run: |
          set -euo pipefail
          mkdir -p qualification
          swift --version | tee qualification/swift-version.txt
          swift build -c release --product numivivo 2>&1 | tee qualification/native-build.log
          BIN=$(swift build -c release --show-bin-path)/numivivo
          "$BIN" neoantigen-evidence-help | tee qualification/native-help.txt
          "$BIN" neoantigen-help | tee qualification/parent-help.txt
          "$BIN" neoantigen-evidence-example --store "$RUNNER_TEMP/neo-store" --output "$RUNNER_TEMP/neo-demo" | tee qualification/synthetic-command-regression.json
          set +e
          "$BIN" neoantigen-evidence-verify "$RUNNER_TEMP/neo-demo/receipt.json" --store "$RUNNER_TEMP/neo-store" > qualification/synthetic-reconstruction.json 2> qualification/synthetic-reconstruction.stderr
          STATUS=$?
          set -e
          test "$STATUS" -eq 2
          grep -q 'verified-and-reconstructed' qualification/synthetic-reconstruction.json
          mkdir -p qualification/runtime
          cp "$BIN" qualification/runtime/numivivo
          BIN_DIR=$(dirname "$BIN")
          find "$BIN_DIR" -maxdepth 1 -name '*.bundle' -exec cp -R '{}' qualification/runtime/ \;
          shasum -a 256 qualification/runtime/numivivo | tee qualification/native-executable.sha256
          git rev-parse HEAD > qualification/source-commit.txt
          tar -czf qualification/native-runtime.tar.gz -C qualification/runtime .
          rm -rf qualification/runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc1395-native-runtime
          path: qualification/
          retention-days: 14
