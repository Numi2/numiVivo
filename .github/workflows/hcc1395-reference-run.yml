name: HCC1395 reference execution
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hcc1395-reference-run.yml
      - Tools/Neoantigen/HCC1395/reference_*.py
permissions:
  contents: read
concurrency:
  group: hcc1395-reference-execution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve-real-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve RNA reads and record exact source metadata
        run: |
          mkdir -p evidence
          python3 -u - <<'PY' | tee evidence/source-resolution.log
          import concurrent.futures, json, re, urllib.parse, urllib.request
          urls=['https://genomedata.org/hcc1395/fastqs/','https://genomedata.org/hcc1395/fastqs/chr6/','https://genomedata.org/hcc1395/fastqs/chr6_and_chr17/','https://genomedata.org/hcc1395/fastqs/all/','https://genomedata.org/rnaseq-tutorial/','https://genomedata.org/hcc1395/references/genome/chr6/','https://genomedata.org/hcc1395/references/transcriptome/chr6_and_chr17/','https://zenodo.org/api/records/17809276']
          def get(url):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'NumiVivo-reference-qualification'}),timeout=30) as r: data=r.read(1024*1024)
              if '/api/records/' in url:
                return {'url':url,'files':json.loads(data).get('files',[])}
              return {'url':url,'links':[urllib.parse.urljoin(url,x) for x in re.findall(r'href="([^"]+)"',data.decode()) if not x.startswith(('?','/'))]}
            except Exception as e:return {'url':url,'error':str(e)[:180]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool: pages=list(pool.map(get,urls))
          for p in pages: print('SOURCE '+json.dumps(p))
          files=sorted(set(u for p in pages for u in p.get('links',[]) if not u.endswith('/') and any(k in u for k in ['RNA','rna','ref_genome.tar','hisat','practical.tar'])))
          def head(url):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,method='HEAD'),timeout=20) as r:return {'url':url,'bytes':r.headers.get('Content-Length'),'modified':r.headers.get('Last-Modified')}
            except Exception as e:return {'url':url,'error':str(e)[:180]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool: inventory=list(pool.map(head,files))
          for item in inventory:print('FILE '+json.dumps(item))
          open('evidence/public-rna-files.json','w').write(json.dumps({'pages':pages,'files':inventory},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc1395-rna-source-resolution
          path: evidence/
          retention-days: 7
  real-tool-provisioning:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Build pinned RegTools and provision real RNA alignment tools
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo apt-get update -qq
          sudo apt-get install -y samtools hisat2 cmake build-essential zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev
          git clone --depth 1 https://github.com/griffithlab/regtools.git regtools-source
          cd regtools-source
          git fetch --depth 1 origin 17b6cf456169ded4fad9cc4243a02981fb1cbb74
          git checkout --detach 17b6cf456169ded4fad9cc4243a02981fb1cbb74
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          cd ..
          cp regtools-source/build/regtools evidence/regtools
          sha256sum evidence/regtools | tee evidence/regtools.sha256
          samtools --version | tee evidence/samtools-version.txt
          hisat2 --version | tee evidence/hisat2-version.txt
          evidence/regtools cis-splice-effects identify --help 2>&1 | tee evidence/regtools-help.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc1395-regtools-binary
          path: evidence/
          retention-days: 7
