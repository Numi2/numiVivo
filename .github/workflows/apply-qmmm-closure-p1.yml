name: One-time QM/MM reaction-coordinate closure
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-qmmm-closure-p1.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Correct shared-atom coordinate gradients and gate unsupported analytic rate metric
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sources/NumiVivoKit/QMEnv/VivoQMMMFreeEnergy.swift')
          s=p.read_text()
          old='''    public func validate() throws {\n        let expected = kind == .distance ? 2 : 4\n        guard !identifier.trimmingCharacters(in:.whitespacesAndNewlines).isEmpty,\n              atomIndices.count==expected,Set(atomIndices).count==atomIndices.count else {\n            throw VivoChemistryError.invalid("reaction-coordinate identity or atom arity")\n        }\n    }'''
          new='''    public func validate() throws {\n        let expected = kind == .distance ? 2 : 4\n        guard !identifier.trimmingCharacters(in:.whitespacesAndNewlines).isEmpty,atomIndices.count==expected else {\n            throw VivoChemistryError.invalid("reaction-coordinate identity or atom arity")\n        }\n        switch kind {\n        case .distance:\n            guard atomIndices[0] != atomIndices[1] else {\n                throw VivoChemistryError.invalid("distance coordinate requires two distinct atoms")\n            }\n        case .distanceDifference:\n            let first=Set([atomIndices[0],atomIndices[1]]),second=Set([atomIndices[2],atomIndices[3]])\n            guard first.count==2,second.count==2,first != second else {\n                throw VivoChemistryError.invalid("distance-difference coordinate requires two nonidentical atom pairs")\n            }\n        }\n    }'''
          assert old in s
          s=s.replace(old,new)
          old2='''        case .distanceDifference:\n            let (a,u)=try bond(particleIndices[0],particleIndices[1])\n            let (b,v)=try bond(particleIndices[2],particleIndices[3])\n            return (a-b,[particleIndices[0]:u,particleIndices[1]:u*(-1),\n                         particleIndices[2]:v*(-1),particleIndices[3]:v])'''
          new2='''        case .distanceDifference:\n            let (a,u)=try bond(particleIndices[0],particleIndices[1])\n            let (b,v)=try bond(particleIndices[2],particleIndices[3])\n            var gradients:[UInt32:VivoVector3D]=[:]\n            func accumulate(_ particle:UInt32,_ contribution:VivoVector3D) {\n                gradients[particle]=(gradients[particle] ?? .zero)+contribution\n            }\n            accumulate(particleIndices[0],u);accumulate(particleIndices[1],u*(-1))\n            accumulate(particleIndices[2],v*(-1));accumulate(particleIndices[3],v)\n            return (a-b,gradients)'''
          assert old2 in s
          p.write_text(s.replace(old2,new2))

          q=Path('Sources/NumiVivoKit/QMEnv/VivoQMMMFreeEnergyQualification.swift')
          x=q.read_text()
          old3='''    private static func inverseMassMetricPerDa(coordinate:VivoQMMMReactionCoordinate,system:VivoClassicalSystem)throws->Double {\n        let resolved=try VivoQMMMResolvedCoordinate(source:coordinate,system:system)\n        var value=0.0\n        for particle in resolved.particleIndices {\n            let mass=system.particles[Int(particle)].massDa\n            guard mass.isFinite,mass>0 else { throw VivoChemistryError.invalid("reaction-coordinate atom has no positive physical mass") }\n            value+=1/mass\n        }\n        guard value.isFinite,value>0 else { throw VivoChemistryError.invalid("reaction-coordinate inverse mass metric") }\n        return value\n    }'''
          new3='''    private static func inverseMassMetricPerDa(coordinate:VivoQMMMReactionCoordinate,system:VivoClassicalSystem)throws->Double {\n        // The closed-form metric is valid only when every coordinate atom is unique.\n        // Shared-atom transfer coordinates have geometry-dependent cross terms and\n        // are rate-qualified later from the sampled dividing-surface velocity ensemble.\n        guard Set(coordinate.atomIndices).count==coordinate.atomIndices.count else {\n            throw VivoChemistryError.unsupported("shared-atom reaction coordinates require sampled surface velocity normalization")\n        }\n        let resolved=try VivoQMMMResolvedCoordinate(source:coordinate,system:system)\n        var value=0.0\n        for particle in resolved.particleIndices {\n            let mass=system.particles[Int(particle)].massDa\n            guard mass.isFinite,mass>0 else { throw VivoChemistryError.invalid("reaction-coordinate atom has no positive physical mass") }\n            value+=1/mass\n        }\n        guard value.isFinite,value>0 else { throw VivoChemistryError.invalid("reaction-coordinate inverse mass metric") }\n        return value\n    }'''
          assert old3 in x
          q.write_text(x.replace(old3,new3))
          PY
          cat > Tests/NumiVivoIntegrationTests/QMMMReactionCoordinateTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NumiVivoKit

          @Suite struct QMMMReactionCoordinateTests {
              private func system() throws -> VivoClassicalSystem {
                  let structure=try VivoCanonicalJSON.fingerprint(Data("shared-transfer-structure".utf8))
                  return VivoClassicalSystem(identifier:"shared-transfer",structureFingerprint:structure,particles:[
                      .init(index:0,atomIndex:0,typeIdentifier:"D",massDa:14,chargeE:0,sigmaNM:0,epsilonKJPerMol:0),
                      .init(index:1,atomIndex:1,typeIdentifier:"H",massDa:1,chargeE:0,sigmaNM:0,epsilonKJPerMol:0),
                      .init(index:2,atomIndex:2,typeIdentifier:"A",massDa:16,chargeE:0,sigmaNM:0,epsilonKJPerMol:0)
                  ])
              }

              @Test func sharedHydrogenDistanceDifferenceAccumulatesJacobian() throws {
                  let coordinate=VivoQMMMReactionCoordinate(identifier:"proton-transfer",kind:.distanceDifference,
                      atomIndices:[0,1,1,2])
                  try coordinate.validate()
                  let resolved=try VivoQMMMResolvedCoordinate(source:coordinate,system:system())
                  let geometry=try VivoMDCandidateGeometry(particlePositionsNM:[.init(0,0,0),.init(0.10,0,0),.init(0.25,0,0)],periodicCell:nil)
                  let value=try resolved.evaluate(geometry)
                  #expect(abs(value.valueNM + 0.05)<1e-12)
                  #expect(value.gradients.count==3)
                  #expect(abs(value.gradients[0]!.x + 1)<1e-12)
                  #expect(abs(value.gradients[1]!.x - 2)<1e-12)
                  #expect(abs(value.gradients[2]!.x + 1)<1e-12)
              }

              @Test func sharedCoordinateJacobianMatchesFiniteDifference() throws {
                  let coordinate=VivoQMMMReactionCoordinate(identifier:"bent-proton-transfer",kind:.distanceDifference,
                      atomIndices:[0,1,1,2])
                  let resolved=try VivoQMMMResolvedCoordinate(source:coordinate,system:system())
                  var positions=[VivoVector3D(0,0,0),VivoVector3D(0.10,0.03,0),VivoVector3D(0.22,-0.02,0)]
                  let base=try resolved.evaluate(VivoMDCandidateGeometry(particlePositionsNM:positions,periodicCell:nil))
                  let h=1e-7
                  for particle in 0..<3 {
                      positions[particle].x += h
                      let plus=try resolved.evaluate(VivoMDCandidateGeometry(particlePositionsNM:positions,periodicCell:nil)).valueNM
                      positions[particle].x -= 2*h
                      let minus=try resolved.evaluate(VivoMDCandidateGeometry(particlePositionsNM:positions,periodicCell:nil)).valueNM
                      positions[particle].x += h
                      let numeric=(plus-minus)/(2*h)
                      #expect(abs(numeric-base.gradients[UInt32(particle)]!.x)<1e-7)
                  }
              }
          }
          SWIFT
          git diff --check
          git add Sources/NumiVivoKit/QMEnv/VivoQMMMFreeEnergy.swift Sources/NumiVivoKit/QMEnv/VivoQMMMFreeEnergyQualification.swift Tests/NumiVivoIntegrationTests/QMMMReactionCoordinateTests.swift
          git -c user.name='NumiVivo closure' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(qmmm): support shared-atom proton-transfer coordinates'
          git push origin HEAD:main
